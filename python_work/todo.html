<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 32px 28px;
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #2d3748;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .input-group input::placeholder {
            color: #a0aec0;
        }

        .btn-add {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.25s;
            white-space: nowrap;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
            color: #718096;
        }

        .stats strong {
            color: #667eea;
        }

        .btn-clear {
            background: none;
            border: none;
            color: #e53e3e;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn-clear:hover {
            opacity: 0.7;
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f7fafc;
            border-radius: 10px;
            transition: background 0.2s, transform 0.2s;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-item:hover {
            background: #edf2f7;
        }

        .todo-item.completed {
            background: #f0fff4;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #cbd5e0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s;
        }

        .checkbox:hover {
            border-color: #667eea;
        }

        .todo-item.completed .checkbox {
            background: #48bb78;
            border-color: #48bb78;
        }

        .checkbox::after {
            content: '✓';
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .todo-item.completed .checkbox::after {
            opacity: 1;
        }

        .todo-text {
            flex: 1;
            font-size: 15px;
            color: #2d3748;
            word-break: break-word;
        }

        .btn-delete {
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            color: #a0aec0;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            background: #fed7d7;
            color: #e53e3e;
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 32px 0;
            font-size: 14px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 我的 <span>Todo</span></h1>

        <div class="input-group">
            <input
                type="text"
                id="todoInput"
                placeholder="输入新的待办事项..."
                maxlength="200"
            >
            <button class="btn-add" id="btnAdd">添加</button>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <span>共 <strong id="totalCount">0</strong> 项，已完成 <strong id="doneCount">0</strong></span>
            <button class="btn-clear" id="btnClear">清除已完成</button>
        </div>

        <ul class="todo-list" id="todoList">
            <li class="empty-state">
                <span class="icon">🎯</span>
                还没有待办事项，快来添加一个吧！
            </li>
        </ul>
    </div>

    <script>
        // ---------- 数据管理 ----------
        const STORAGE_KEY = 'todo_app_data';

        function loadTodos() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch {
                return [];
            }
        }

        function saveTodos(todos) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        }

        let todos = loadTodos();

        // ---------- DOM 元素 ----------
        const todoInput   = document.getElementById('todoInput');
        const btnAdd      = document.getElementById('btnAdd');
        const todoList    = document.getElementById('todoList');
        const stats       = document.getElementById('stats');
        const totalCount  = document.getElementById('totalCount');
        const doneCount   = document.getElementById('doneCount');
        const btnClear    = document.getElementById('btnClear');

        // ---------- 渲染 ----------
        function render() {
            todoList.innerHTML = '';

            if (todos.length === 0) {
                todoList.innerHTML = `
                    <li class="empty-state">
                        <span class="icon">🎯</span>
                        还没有待办事项，快来添加一个吧！
                    </li>
                `;
                stats.style.display = 'none';
                return;
            }

            stats.style.display = 'flex';

            const completedCount = todos.filter(t => t.done).length;
            totalCount.textContent = todos.length;
            doneCount.textContent  = completedCount;

            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = 'todo-item' + (todo.done ? ' completed' : '');
                li.innerHTML = `
                    <div class="checkbox" data-index="${index}"></div>
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <button class="btn-delete" data-index="${index}" title="删除">×</button>
                `;
                todoList.appendChild(li);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---------- 操作 ----------
        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) {
                todoInput.focus();
                return;
            }
            todos.push({ text, done: false });
            saveTodos(todos);
            todoInput.value = '';
            todoInput.focus();
            render();
        }

        function toggleTodo(index) {
            todos[index].done = !todos[index].done;
            saveTodos(todos);
            render();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            saveTodos(todos);
            render();
        }

        function clearCompleted() {
            todos = todos.filter(t => !t.done);
            saveTodos(todos);
            render();
        }

        // ---------- 事件绑定 ----------
        btnAdd.addEventListener('click', addTodo);

        todoInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        todoList.addEventListener('click', (e) => {
            const checkbox = e.target.closest('.checkbox');
            const deleteBtn = e.target.closest('.btn-delete');

            if (checkbox) {
                const index = parseInt(checkbox.dataset.index, 10);
                toggleTodo(index);
            }

            if (deleteBtn) {
                const index = parseInt(deleteBtn.dataset.index, 10);
                deleteTodo(index);
            }
        });

        btnClear.addEventListener('click', clearCompleted);

        // ---------- 初始渲染 ----------
        render();
    </script>
</body>
</html>
